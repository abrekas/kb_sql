<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ввод "Обойма револьвера"</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
        }

        .revolver-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
        }

        .revolver-drum {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #444;
            background-color: #2a2a2a;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .bullet {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-top: -25px;
            margin-left: -25px;
            border-radius: 50%;
            background-color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            border: 2px solid #777;
        }

        .bullet:hover {
            background-color: #888;
            transform: scale(1.1);
        }

        .bullet.active {
            background-color: #d9534f;
            box-shadow: 0 0 10px #d9534f;
        }

        #output {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #d9534f;
        }
    </style>
</head>
<body>

    <div class="revolver-wrapper">
        <div class="revolver-drum" id="drum">
            <!-- Пули генерируются с помощью JS -->
        </div>
    </div>

    <div id="output">Выберите патрон</div>
    <input type="hidden" id="selectedValue">

    <script>
        const values = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        const drum = document.getElementById('drum');
        const output = document.getElementById('output');
        const hiddenInput = document.getElementById('selectedValue');
        
        let currentRotation = 0;

        // Создаем пули (секторы) динамически
        const step = 360 / values.length;
        values.forEach((value, index) => {
            const angle = index * step;
            
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.innerText = value;

            // Вычисляем позицию по кругу (тригонометрия)
            const radius = 80; // Радиус расположения
            const rad = (angle * Math.PI) / 180;
            const x = radius * Math.cos(rad);
            const y = radius * Math.sin(rad);

            bullet.style.transform = `translate(${x}px, ${y}px)`;

            // Обработчик клика
            bullet.addEventListener('click', () => {
                // Высчитываем нужный угол, чтобы выбранный элемент встал наверх (0 градусов/минус текущий)
                currentRotation = -angle; 
                drum.style.transform = `rotate(${currentRotation}deg)`;

                // Обновляем вывод и активный класс
                document.querySelectorAll('.bullet').forEach(b => b.classList.remove('active'));
                bullet.classList.add('active');

                output.innerText = `Выбрано: ${value}`;
                hiddenInput.value = value;
            });

            drum.appendChild(bullet);
        });
    </script>
</body>
</html>
